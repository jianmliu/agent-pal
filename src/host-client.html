<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>仙剑 · 远程屏幕</title>
<style>
  :root {
    --bg: #0c0e11; --panel: #14171c; --line: #242932; --fg: #dde1e7; --dim: #7d8691; --faint: #4a515b;
    --accent: #e0b25a; --live: #e5484d; --ok: #5fb37a; --warn: #d9a441; --bad: #e06a5a;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 15px/1.5 ui-sans-serif, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
  .mono { font-family: ui-monospace, Menlo, monospace; }
  body { display: grid; grid-template-columns: minmax(0, 1fr) clamp(380px, 27vw, 520px); gap: 12px; padding: 12px; }
  @media (max-width: 1100px) { body { grid-template-columns: minmax(0, 1fr); } }

  main { display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 8px; min-width: 0; }
  /* 画面尽量大:宽度撑满这一栏,但不超过「窗口高度减去下面的状态栏」按 320:200 折算的宽度(不出现纵向滚动条) */
  #screen { position: relative; width: min(100%, calc((100vh - 24px - var(--below, 150px)) * 1.6)); overflow: hidden; border-radius: 4px; }
  @media (max-width: 1100px) { #screen { width: 100%; } }
  #below { width: 100%; display: flex; flex-direction: column; gap: 6px; }
  #info { display: flex; flex-wrap: wrap; gap: 8px; align-items: stretch; }
  .member { flex: 1 1 150px; max-width: 260px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .member.down { opacity: .55; }
  .member .who { display: flex; justify-content: space-between; gap: 8px; font-size: 15px; }
  .member .who .lv { color: var(--dim); font-size: 13px; }
  .bar { position: relative; height: 16px; border-radius: 3px; background: #1c2127; overflow: hidden; font-size: 12px; line-height: 16px; }
  .bar i { position: absolute; inset: 0 auto 0 0; background: #3f8f5c; transition: width .3s; }
  .bar.mp i { background: #3d6ea3; } .bar.low i { background: #b0563f; }
  .bar span { position: relative; padding: 0 6px; color: #e9edf2; font-variant-numeric: tabular-nums; }
  #facts { flex: 2 1 300px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 2px 14px; align-content: center; }
  @media (max-width: 520px) { #facts { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  #facts div { display: flex; flex-direction: column; min-width: 0; }
  #facts .k { color: var(--faint); font-size: 12px; }
  #facts .v { font-size: 16px; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #facts .v.fight { color: var(--live); }
  canvas { display: block; width: 100%; aspect-ratio: 320 / 200; image-rendering: pixelated; background: #000; }
  #start { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,.7); cursor: pointer; font-size: 20px; color: var(--accent); z-index: 3; }
  #danmaku { position: absolute; inset: 0; pointer-events: none; z-index: 2; }
  .dm { position: absolute; left: 100%; white-space: nowrap; font-size: clamp(16px, 2vw, 30px); color: #fff; text-shadow: 0 0 3px #000, 0 0 3px #000, 1px 1px 0 #000;
        animation: fly var(--dur, 9s) linear forwards; will-change: transform; }
  .dm.ai { color: var(--accent); font-weight: 600; }
  @keyframes fly { to { transform: translateX(calc(-100vw - 100%)); } }
  #hud { color: var(--dim); font-size: 14px; }
  #hud b { color: var(--fg); font-weight: normal; }
  .bad { color: var(--bad) !important; }
  #keys { color: var(--faint); font-size: 14px; text-align: center; }

  aside { display: flex; flex-direction: column; gap: 12px; min-height: 0; height: calc(100vh - 24px); }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; display: flex; flex-direction: column; min-height: 0; }
  .card h2 { margin: 0; padding: 10px 12px; font-size: 14px; font-weight: 600; letter-spacing: .06em; color: var(--dim); border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 8px; }
  .card h2 .grow { flex: 1; }

  #status { padding: 12px; gap: 6px; }
  #status .row { display: flex; align-items: center; gap: 4px 10px; flex-wrap: wrap; }
  #status .row > * { white-space: nowrap; }
  .badge { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: #2a1416; color: var(--live); }
  .badge::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--live); animation: pulse 1.6s ease-in-out infinite; }
  .badge.off { background: #1c2026; color: var(--dim); } .badge.off::before { background: var(--dim); animation: none; }
  @keyframes pulse { 50% { opacity: .3; } }
  #viewers { color: var(--dim); font-size: 14px; }
  #speedBox { margin-left: auto; font-size: 14px; color: var(--dim); display: inline-flex; align-items: center; gap: 6px; }
  #speedBox select { background: #0f1216; color: var(--fg); border: 1px solid var(--line); border-radius: 4px; font: inherit; font-size: 14px; padding: 1px 4px; }
  #story1xLabel { display: inline-flex; align-items: center; gap: 3px; cursor: pointer; user-select: none; color: var(--fg); font-size: 13px; margin-left: 4px; }
  #story1xLabel input { accent-color: var(--accent); margin: 0; cursor: pointer; }
  #storyBadge { font-size: 12px; padding: 1px 6px; border-radius: 999px; background: #2b2414; color: var(--accent); border: 1px solid #5a4a26; }
  #coopBtn { font-size: 13px; padding: 2px 8px; border-radius: 4px; font-weight: 600; }
  #coopBtn.human { background: #183324; color: var(--ok); border-color: var(--ok); }
  #role { font-size: 14px; color: var(--dim); }
  #now { display: flex; flex-direction: column; gap: 4px; }
  #now .thought { font-size: 19px; line-height: 1.5; color: var(--fg); text-wrap: pretty; }
  #now .thought.idle { color: var(--dim); font-size: 16px; }
  #now .doing { font-size: 14px; color: var(--accent); }
  #now .doing::before { content: "● "; animation: pulse 1s infinite; }
  #now .doing.done { color: var(--dim); } #now .doing.done::before { content: ""; }

  #mapCard { flex: none; }
  #mapCard.closed #mapBody { display: none; }
  #mapBody { padding: 8px; display: flex; flex-direction: column; gap: 6px; }
  #mini { display: block; width: 100%; height: clamp(180px, 30vh, 320px); background: #06080a; border-radius: 4px; }
  #mapLegend { font-size: 13px; color: var(--dim); display: flex; flex-wrap: wrap; gap: 2px 12px; }
  #mapLegend .ex { white-space: nowrap; }
  #mapLegend .ex::before { content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; }
  #mapLegend .ex.used::before { background: var(--ok); }
  #mapLegend .ex.new { color: var(--accent); } #mapLegend .ex.new::before { box-shadow: inset 0 0 0 2px var(--accent); }
  #mapLegend .dead { color: var(--bad); }
  #mapToggle { font-size: 13px; padding: 1px 8px; margin-left: 6px; }

  #feedCard { flex: 1 1 55%; }
  #feed, #chat { list-style: none; margin: 0; padding: 6px 0; overflow-y: auto; flex: 1; min-height: 120px; }
  #feed > li { padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; }
  #feed > li + li { border-top: 1px solid #1a1e24; }
  #feed .thought { font-size: 17px; line-height: 1.6; color: var(--fg); white-space: pre-line; overflow-wrap: anywhere; }
  #feed .acts { list-style: none; margin: 0; padding: 0 0 0 10px; border-left: 2px solid var(--line); display: flex; flex-direction: column; gap: 2px; }
  #feed .acts:empty { display: none; }
  #feed .speak { color: var(--accent); font-size: 13px; }
  #feed .speak::before { content: "♪ "; }
  #feed > li.chapter { margin: 8px 12px; padding: 12px 14px; border: 1px solid #5a4a26; border-radius: 6px; background: #1b1810; }
  #feed > li.chapter + li, #feed > li + li.chapter { border-top: 1px solid #5a4a26; }
  #feed > li.chapter + li:not(.chapter) { border-top: 0; }
  #feed .chapter .title, #chapters summary { color: var(--accent); font-weight: 600; }
  #feed .chapter .title { font-size: 17px; }
  #feed .chapter .text, #chapters .text { white-space: pre-line; line-height: 1.7; overflow-wrap: anywhere; }
  #chapCard { flex: none; }
  #chapters { max-height: 26vh; overflow-y: auto; padding: 6px 12px 10px; display: flex; flex-direction: column; gap: 4px; }
  #chapters summary { cursor: pointer; font-size: 15px; }
  #chapters .text { color: #c6ccd4; font-size: 15px; padding: 4px 0 6px 14px; }
  #voiceBtn { font-size: 13px; padding: 1px 8px; }
  #feed .act { font-size: 14px; color: var(--dim); display: flex; gap: 6px; align-items: baseline; }
  #feed .act .what { min-width: 0; overflow-wrap: anywhere; }
  #feed .out.ok { color: var(--ok); } #feed .out.soft { color: var(--warn); } #feed .out.fail { color: var(--bad); }
  #feed .out.run { color: var(--accent); animation: pulse 1s infinite; }
  #feed .ms { color: var(--faint); font-size: 13px; font-variant-numeric: tabular-nums; margin-left: auto; white-space: nowrap; }
  #feed .time { font-size: 13px; color: var(--faint); }
  #feed .act.fight { flex-wrap: wrap; align-items: center; row-gap: 3px; }
  #feed .act.fight .what { color: var(--fg); }
  #feed .moves { display: inline-flex; flex-wrap: wrap; gap: 3px 4px; min-width: 0; flex: 1 1 60%; }
  #feed .chip { padding: 0 6px; border-radius: 999px; background: #1e232b; color: var(--dim); font-size: 13px; line-height: 22px; white-space: nowrap; }
  #feed .chip.run { color: var(--accent); animation: pulse 1s infinite; }
  #feed .chip.no { color: var(--faint); text-decoration: line-through; }
  #feed .more { font-size: 13px; color: var(--faint); }
  #feed .out.none { color: var(--faint); }
  #feed .story { font-size: 14px; color: #a9b4c2; border-left: 2px solid #33404f; margin-left: -12px; padding-left: 10px; display: flex; flex-direction: column; gap: 1px; }
  #feed .story .line { overflow-wrap: anywhere; }
  #feed .story summary { color: var(--faint); cursor: pointer; }
  #feed .act.scene { color: var(--faint); }
  #feed .act.sub { color: var(--dim); padding-left: 12px; }
  #feed .act.sub.bad { color: var(--bad); }

  #chatCard { flex: 1 1 45%; }
  .card[hidden] { display: none; }
  #chat li { padding: 3px 12px; overflow-wrap: anywhere; }
  #chat .who { color: #8fb4d9; margin-right: 6px; }
  #chat li.ai .who { color: var(--accent); }
  #chat li.ai { background: #1d1a12; }
  #chat li.sys { color: var(--faint); font-size: 14px; }
  #say { display: flex; gap: 6px; padding: 8px; border-top: 1px solid var(--line); }
  #say input { min-width: 0; background: #0f1216; color: var(--fg); border: 1px solid var(--line); border-radius: 4px; padding: 6px 8px; font: inherit; }
  #say input:focus { outline: 1px solid var(--accent); border-color: var(--accent); }
  #nick { width: 96px; } #msg { flex: 1; }
  button { background: #222831; color: var(--fg); border: 1px solid var(--line); border-radius: 4px; padding: 4px 10px; font: inherit; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  #dmToggle { font-size: 13px; padding: 1px 8px; }
  .empty { color: var(--faint); padding: 8px 12px; font-size: 14px; }

  /* 回放条(回放模式才有:replay.mjs) */
  #replay { display: flex; align-items: center; gap: 8px; padding: 4px 0; }
  #replay[hidden] { display: none; }
  #replay button { min-width: 84px; }
  #replay select { background: #0f1216; color: var(--fg); border: 1px solid var(--line); border-radius: 4px; font: inherit; font-size: 14px; padding: 2px 4px; }
  #rpSeek { flex: 1; min-width: 0; accent-color: var(--accent); }
  #rpTime { font-size: 14px; color: var(--dim); font-variant-numeric: tabular-nums; white-space: nowrap; }
  /* 录屏用(?capture):不要回放条和调试行 */
  body.capture #replay, body.capture #hud, body.capture #start, body.capture #voiceBtn, body.capture #mapToggle { display: none; }
  body.capture * { animation: none !important; }

  /* 窄屏:上下堆叠,页面自己滚动。放在最后,盖过上面按「一屏高」写的规则 */
  @media (max-width: 1100px) {
    html, body { height: auto; }
    aside { height: auto; }
    #feedCard, #chatCard { flex: none; }
    #chapters { max-height: none; }
    #feed, #chat { flex: none; height: 300px; }
  }
</style>
</head>
<body>
<main>
  <div id="screen">
    <canvas id="cvs" width="320" height="200"></canvas>
    <div id="danmaku"></div>
    <div id="start">点击开始(启用声音、键盘)</div>
  </div>
  <div id="below">
    <div id="replay" hidden>
      <button id="rpPlay" type="button" title="空格">▶ 播放</button>
      <select id="rpRec" aria-label="第几轮" hidden></select>
      <input id="rpSeek" type="range" min="0" max="0" step="100" value="0" aria-label="进度" title="← → 退 / 进 5 秒">
      <span id="rpTime" class="mono">0:00 / 0:00</span>
      <select id="rpRate" aria-label="回放倍速"></select>
    </div>
    <div id="info"><div id="facts"></div></div>
    <div id="hud" class="mono">连接中…</div>
    <div id="keys">方向键 移动 · Enter/空格 确认 · Esc 菜单 · ` 接管/交回AI · R 重复 · A 自动 · D 防御 · E 物品 · W 投掷 · Q 逃跑 · S 状态 · F 法术</div>
  </div>
</main>
<aside>
  <section class="card" id="status">
    <div class="row"><span id="liveBadge" class="badge off">未连接</span><span id="viewers"></span><span id="speedBox"><span id="speedPick" hidden>场景 <select id="speedScene" aria-label="场景倍速" title="走路、怪的追击、按帧计的计时(1× = 原版 10 帧/秒)"></select> 战斗 <select id="speedBattle" aria-label="战斗倍速" title="战斗帧,以及对白、过场延时、菜单(1× = 原版)"></select><label id="story1xLabel" title="开启后：平时按所选倍速加速，遇到剧情对话或过场动画自动恢复 1× 原速"><input id="story1x" type="checkbox"> 剧情1×</label><span id="storyBadge" hidden>📖 1×中</span></span><span id="speedLabel"></span></span><button id="coopBtn" type="button" hidden title="按任意游戏键自动接管；点此或按 ` 键在真人接管与交回 AI 之间切换">🎮 接管</button><span id="role"></span></div>
    <div id="now"><div class="thought idle">等 AI 开口…</div></div>
  </section>
  <section class="card" id="mapCard">
    <h2><span class="grow">小地图<span id="mapPlace"></span></span><button id="mapToggle" type="button">收起</button></h2>
    <div id="mapBody">
      <canvas id="mini"></canvas>
      <div id="mapLegend"><span>亮的地方是走过的;进了场景才有地图</span></div>
    </div>
  </section>
  <section class="card" id="chapCard" hidden>
    <h2><span class="grow">章节小结</span><span id="chapCount"></span></h2>
    <div id="chapters"></div>
  </section>
  <section class="card" id="feedCard">
    <h2><span class="grow" id="feedTitle">AI 的想法</span><button id="voiceBtn" type="button" hidden>配音 开</button><span id="calls"></span></h2>
    <ul id="feed"><li class="empty">AI 写下的想法会出现在这里,它做的操作挂在下面</li></ul>
  </section>
  <section class="card" id="chatCard" hidden>
    <h2><span class="grow">聊天 · 弹幕</span><button id="dmToggle" type="button">弹幕 开</button></h2>
    <ul id="chat"><li class="sys">发的话会飘在画面上;AI 可以用 chat 工具读到并回话(只当建议,不一定照做)</li></ul>
    <form id="say" autocomplete="off"><input id="nick" maxlength="16" aria-label="昵称"><input id="msg" maxlength="140" placeholder="说点什么…" aria-label="消息"><button type="submit">发送</button></form>
  </section>
</aside>
<script>
'use strict';
const W = 320, H = 200;
const $ = (id) => document.getElementById(id);
const cvs = $('cvs'), ctx = cvs.getContext('2d');
const img = ctx.createImageData(W, H), px = new Uint32Array(img.data.buffer);
const lut = new Uint32Array(256);
let indices = new Uint8Array(W * H), palRgb = new Uint8Array(768), shake = 0, dirty = false;

// /watch = 观战:只看不按(服务端也按 role=watch 拒收按键;--watch-only 时全员观战,以 hello 为准)
let watching = location.pathname === '/watch';
const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch { /* */ } } };

// ---- 键盘 → 引擎 Key 枚举名(与 input-service 的 KeyCodesToPalKeys 一致) ----
const KEYMAP = {
  ArrowUp: 'Up', ArrowDown: 'Down', ArrowLeft: 'Left', ArrowRight: 'Right',
  Numpad8: 'Up', Numpad2: 'Down', Numpad4: 'Left', Numpad6: 'Right',
  Enter: 'Search', NumpadEnter: 'Search', Space: 'Search', ControlLeft: 'Search', ControlRight: 'Search',
  Escape: 'Menu', Insert: 'Menu', Numpad0: 'Menu',
  PageUp: 'PageUp', PageDown: 'PageDown', Home: 'Home', End: 'End', Numpad9: 'PageUp', Numpad3: 'PageDown', Numpad7: 'Home', Numpad1: 'End',
  KeyR: 'Repeat', KeyA: 'Auto', KeyD: 'Defend', KeyE: 'UseItem', KeyW: 'ThrowItem', KeyQ: 'Flee', KeyS: 'Status', KeyF: 'Force'
};

// ---- 延迟统计 ----
let ws = null, inputSeq = 0, pingRtt = null, recvFrames = 0, fps = 0, recvBytes = 0, kbps = 0;
const pendingInputs = new Map();        // 输入序号 → 按下时刻
const lat = [];                         // 按键 → 处理了这次按键之后的第一帧 到达(毫秒)
const pct = (a, q) => { if (!a.length) return null; const s = [...a].sort((x, y) => x - y); return s[Math.min(s.length - 1, Math.floor(q * s.length))]; };

// ---- 声音 ----
let actx = null, sfxGain = null, musicEl = null, musicBase = '';
const sfxBuf = new Map();
async function playSfx(n) {
  if (!actx) return;
  let p = sfxBuf.get(n);
  if (!p) { p = fetch(`/sfx/${n}.wav`).then((r) => r.ok ? r.arrayBuffer() : null).then((b) => b && actx.decodeAudioData(b)).catch(() => null); sfxBuf.set(n, p); }
  const buf = await p; if (!buf) return;
  const src = actx.createBufferSource(); src.buffer = buf; src.connect(sfxGain || actx.destination); src.start();
}
function playMusic(n, loop) {
  if (!musicEl) return;
  if (!n) { musicEl.pause(); musicEl.removeAttribute('src'); return; }
  musicEl.loop = loop !== false; musicEl.src = `${musicBase}${n}.mp3`; if (!rp || rp.playing) musicEl.play().catch(() => {});   // 本地没有 MP3/ 就静默
}
let lastMusic = null;

// ---- 解说的配音:一句播完再播下一句(不叠);播的时候把游戏的音乐 / 音效压低 ----
const DUCK = 0.3, VOICE_WAIT_MS = 20000;
const voiceQ = [];
let voiceNow = null, voiceStop = null, voiceOn = store.get('pal-voice') !== 'off', musicVol = 1, duckTimer = 0;
function duck(on) {
  const to = on ? DUCK : 1;
  if (sfxGain) sfxGain.gain.setTargetAtTime(to, actx.currentTime, 0.08);
  clearInterval(duckTimer);                                    // 音乐是 <audio>(别的源,进不了 WebAudio):音量一小步一小步挪
  duckTimer = setInterval(() => {
    musicVol += Math.sign(to - musicVol) * Math.min(0.1, Math.abs(to - musicVol));
    if (musicEl) musicEl.volume = musicVol;
    if (Math.abs(to - musicVol) < 0.001) clearInterval(duckTimer);
  }, 30);
}
function pumpVoice() {
  if (voiceNow) return;
  let ev; do { ev = voiceQ.shift(); } while (ev && performance.now() - ev.got > VOICE_WAIT_MS);    // 等太久的不播了:话已经过时
  if (!ev) { duck(false); return; }
  const a = new Audio(`/voice/${ev.audio}`); voiceNow = a;
  let guard = 0;
  const done = () => { if (voiceNow !== a) return; clearTimeout(guard); a.pause(); voiceNow = null; ev.mark?.remove(); pumpVoice(); };
  voiceStop = done;
  a.addEventListener('ended', done); a.addEventListener('error', done);
  guard = setTimeout(done, (ev.audioMs || 15000) + 5000);       // 文件坏了 / 一直不触发 ended:别把后面的堵死
  duck(true);
  if (ev.li) { ev.mark = el('div', 'speak', '正在播'); ev.li.querySelector('.time, .title')?.after(ev.mark); }
  a.play().catch(done);
}
/** 排一句配音。还没点「开始」(浏览器不让出声)或关了配音就不排;积压只留最近 3 句 */
function sayVoice(ev, li) {
  if (!ev.audio || !voiceOn || !actx || (rp && rp.rate !== 1)) return;   // 回放换了倍速:配音对不上画面,不播
  voiceQ.push({ audio: ev.audio, audioMs: ev.audioMs, got: performance.now(), li });
  while (voiceQ.length > 3) voiceQ.shift();
  pumpVoice();
}
function setVoice(on) {
  voiceOn = on; store.set('pal-voice', on ? 'on' : 'off'); $('voiceBtn').textContent = `配音 ${on ? '开' : '关'}`;

  if (b[0] === 2) {
    palRgb = await applyDelta(b[1], b.subarray(2), palRgb);
    for (let i = 0; i < 256; i++) lut[i] = 0xff000000 | (palRgb[i * 3 + 2] << 16) | (palRgb[i * 3 + 1] << 8) | palRgb[i * 3];
    dirty = true;
  } else if (b[0] === 1) {
    const dv = new DataView(b.buffer);
    indices = await applyDelta(b[10], b.subarray(11), indices);
    shake = dv.getInt8(5);
    const ack = dv.getUint32(6, true), now = performance.now();
    for (const [id, t] of pendingInputs) if (id <= ack) { lat.push(now - t); pendingInputs.delete(id); }
    if (lat.length > 200) lat.splice(0, lat.length - 200);
    dirty = true; recvFrames++;
  }
}

function connect() {
  ws = new WebSocket(`ws://${location.host}/ws${watching ? '?role=watch' : ''}`);
  ws.binaryType = 'arraybuffer';
  // 增量要按到达顺序一条条解(解压是异步的);每次重连 host 会先发整份
  let chain = Promise.resolve();
  ws.onmessage = (ev) => {
    recvBytes += typeof ev.data === 'string' ? ev.data.length : ev.data.byteLength;
    chain = chain.then(() => handle(ev.data)).catch((err) => { console.error(err); ws.close(); });
  };
  ws.onclose = () => { hud(true); const b = $('liveBadge'); b.textContent = '已断开'; b.className = 'badge off'; setTimeout(connect, 1000); };
}

function draw() {
  if (dirty) {
    dirty = false;
    for (let y = 0; y < H; y++) {
      const sy = y + shake;                            // 正 = 内容上移(同引擎 VIDEO_UpdateScreen 的奇数次)
      const row = y * W;
      if (sy < 0 || sy >= H) { px.fill(0xff000000, row, row + W); continue; }
      const src = sy * W;
      for (let x = 0; x < W; x++) px[row + x] = lut[indices[src + x]];
    }
    ctx.putImageData(img, 0, 0);
  }
  drawMap();
  requestAnimationFrame(draw);
}

function hud(down = false) {
  const h = $('hud');
  if (down) { h.innerHTML = '<span class="bad">已断开,重连中…</span>'; return; }
  const p50 = pct(lat, 0.5), p95 = pct(lat, 0.95), last = lat[lat.length - 1];
  const f = (v) => v == null ? '—' : v.toFixed(0) + 'ms';
  h.innerHTML = `收帧 <b>${fps}</b>/s <b>${kbps.toFixed(1)}</b>KB/s · 往返 <b>${f(pingRtt)}</b>`
    + (watching ? '' : ` · 按键→画面 最近 <b>${f(last)}</b> 中位 <b>${f(p50)}</b> p95 <b class="${p95 > 100 ? 'bad' : ''}">${f(p95)}</b> (${lat.length} 次)`);
}
setInterval(() => { fps = recvFrames; recvFrames = 0; kbps = recvBytes / 1024; recvBytes = 0; if (ws?.readyState === 1) ws.send(JSON.stringify({ t: 'ping', ts: performance.now() })); hud(); }, 1000);

const held = new Set();
function key(code, down) {
  const name = KEYMAP[code]; if (!name || watching || ws?.readyState !== 1) return false;
  if (down) { if (held.has(code)) return true; held.add(code); } else if (!held.delete(code)) return true;
  const id = ++inputSeq;
  if (down) pendingInputs.set(id, performance.now());
  ws.send(JSON.stringify({ t: 'key', key: name, down, id }));
  return true;
}
const typing = (e) => e.target instanceof HTMLInputElement || e.target instanceof HTMLTextAreaElement || e.target instanceof HTMLSelectElement;
addEventListener('keydown', (e) => {
  if (typing(e)) return;
  if (!watching && !rp && e.code === 'Backquote' && !e.repeat) {
    if (ws?.readyState === 1) ws.send(JSON.stringify({ t: 'coop', holder: coopNow.holder === 'human' ? 'ai' : 'human' }));
    e.preventDefault();
    return;
  }
  if (e.repeat) { if (KEYMAP[e.code] && !watching) e.preventDefault(); return; }
  if (key(e.code, true)) e.preventDefault();
});
addEventListener('keyup', (e) => { if (typing(e)) return; if (key(e.code, false)) e.preventDefault(); });
addEventListener('blur', () => { for (const code of [...held]) key(code, false); });
$('msg').addEventListener('focus', () => { for (const code of [...held]) key(code, false); });

$('start').addEventListener('click', async (e) => {
  e.currentTarget.remove();
  try { actx = new AudioContext(); sfxGain = actx.createGain(); sfxGain.connect(actx.destination); } catch { /* */ }
  musicEl = new Audio(); musicEl.volume = musicVol;
  try { musicBase = (await (await fetch('/config.json')).json()).musicBase || ''; } catch { /* */ }
  if (lastMusic) playMusic(lastMusic.music, lastMusic.loop);
});

setRole(watching ? 'watch' : 'play', false);
connect();
// OBS 的浏览器源没人点「开始」:地址加 ?autostart 就自己开(普通浏览器不点一下不让出声,所以不默认)
if (params.has('autostart')) $('start').click();
requestAnimationFrame(draw);
</script>
</body>
</html>
